<h2 mat-dialog-title>Edit Dish</h2>

<mat-dialog-content>
  <form [formGroup]="editForm" class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Dish Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price ($)</mat-label>
      <input matInput type="number" min="1" formControlName="price">
    </mat-form-field>

    <div class="file-upload">
      <label for="edit-file" class="file-label">Change Image (Optional)</label>
      <input id="edit-file" type="file" (change)="onFileSelected($event)" accept="image/*">
      @if (selectedFile) {
        <span class="file-name">{{ selectedFile.name }}</span>
      }
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  <button class="btn-submit" [disabled]="editForm.invalid" (click)="onSave()">Save Changes</button>
</mat-dialog-actions>
