<h2 mat-dialog-title>
  {{ data.existingReview ? 'Edit Your Review' : 'Leave a Review' }} — {{ data.restaurantName }}
</h2>

<mat-dialog-content>
  <!-- 1. Added id="reviewForm" and the (ngSubmit)="onSubmit()" handler -->
  <form id="reviewForm" [formGroup]="reviewForm" class="dialog-form" (ngSubmit)="onSubmit()">
    
    <!-- Clickable star ratings -->
    <div class="rating-picker">
      <span class="rating-label">Your Rating:</span>
      <div class="stars-row" (mouseleave)="hoverRating.set(0)">
        @for (star of stars; track star) {
          <button 
            type="button" 
            class="star-btn" 
            [class.filled]="star <= (hoverRating() || selectedRating())"
            (mouseenter)="hoverRating.set(star)"
            (click)="setRating(star)">
            ★
          </button>
        }
      </div>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Share your experience</mat-label>
      <!-- 2. Added (keydown.enter), since a normal Enter in the textarea creates a line break -->
      <textarea 
        matInput 
        rows="4" 
        formControlName="comment" 
        placeholder="Write about food, service, and atmosphere..."
        (keydown.enter)="$event.preventDefault(); onSubmit()">
      </textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-cancel" type="button" (click)="onCancel()">Cancel</button>
  <!-- 3. Bound the button to the form through form="reviewForm" and removed the duplicate (click) handler -->
  <button class="btn-submit" type="submit" form="reviewForm" [disabled]="reviewForm.invalid">
    {{ data.existingReview ? 'Update Review' : 'Submit Review' }}
  </button>
</mat-dialog-actions>
