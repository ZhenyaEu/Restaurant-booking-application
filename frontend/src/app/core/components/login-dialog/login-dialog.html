<h2 mat-dialog-title>Log In</h2>

<mat-dialog-content>
  <!-- 1. Добавляем id="loginForm" для формы -->
  <form id="loginForm" [formGroup]="loginForm" class="dialog-form" (ngSubmit)="onSubmit()">
    
    <mat-form-field appearance="outline">
      <mat-label>Enter Email</mat-label>
      <input matInput type="email" formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Enter Password</mat-label>
      <input matInput type="password" formControlName="password">
    </mat-form-field>

    @if (errorMessage) {
      <p class="error-text">{{ errorMessage }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- 2. Указываем type="button", чтобы Cancel случайно не срабатывала как submit -->
  <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
  
  <!-- 3. Связываем кнопку с формой через form="loginForm" и ставим type="submit" -->
  <button type="submit" form="loginForm" class="btn-submit" [disabled]="loginForm.invalid">Submit</button>
</mat-dialog-actions>
